# Render Blueprint: deploys Inkboard as one web service. The Node server
# serves the API, the real-time socket and the built React client.
services:
  - type: web
    name: inkboard
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # The same version as .nvmrc. It must be 22.18 or later, which runs the shared .ts files as they are.
      - key: NODE_VERSION
        value: "22.22"
      # The local development database isn't used in production; skip its download.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      # Your MongoDB Atlas connection string. Render asks for it on first deploy.
      - key: MONGODB_URI
        sync: false
      # Where people open the app, e.g. https://inkboard.example.com: links in emails and sign-in
      # redirects point there. Leave it empty to use the address each request arrives on for sign-in, and
      # this service's own address (onrender.com, which Render passes to the server) in emails; set it
      # once you add a custom domain.
      - key: APP_URL
        sync: false
