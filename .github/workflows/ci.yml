# Checks formatting, then runs the tests and the production build on every push
# and pull request, so a change that breaks sharing, saving or the build is
# caught before it is merged.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      # The server tests start a throwaway MongoDB. Cache its download between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
