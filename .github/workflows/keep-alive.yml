# Render's free plan puts a service to sleep after 15 minutes without traffic.
# Pinging the health endpoint every 10 minutes keeps it awake.
# To point this at another deployment, set a repository variable named
# HEALTH_URL (Settings → Secrets and variables → Actions → Variables).
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://inkboard-b9k8.onrender.com/health' }}
        # A sleeping service can take up to a minute to wake, so allow for it.
        run: curl --fail --silent --show-error --retry 3 --retry-delay 15 --retry-all-errors --max-time 90 "$HEALTH_URL"
