# Render's free plan puts a service to sleep after 15 minutes without traffic.
# Pinging the health endpoint every 10 minutes keeps it awake.
#
# Things to know:
# - Pointing at another deployment: set a repository variable named HEALTH_URL
#   (Settings -> Secrets and variables -> Actions -> Variables). Nothing needs editing here.
# - GitHub runs scheduled workflows late when it is busy, so a gap of 15 minutes now and then
#   is possible and the service may fall asleep for a while. The next ping wakes it.
# - GitHub disables scheduled workflows after 60 days without repository activity. Push a commit,
#   or re-enable the workflow under the Actions tab, if the pings stop.
# - Keeping a free service awake all month uses about 744 of Render's 750 free instance hours,
#   so it can't also host a second free service. Delete this workflow to let the service sleep.
# - A failed run (and the email GitHub sends for it) happens only when the endpoint still
#   doesn't answer after the retries below, so a brief blip doesn't notify anyone.
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://inkboard-b9k8.onrender.com/health' }}
        # A sleeping service can take up to a minute to wake, so each try waits up to 90 seconds.
        # Fail only after the first try and two retries 30 seconds apart have all failed.
        run: curl --fail --silent --show-error --retry 2 --retry-delay 30 --retry-all-errors --max-time 90 "$HEALTH_URL"
